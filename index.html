<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>paragonpdx hub</title>
<meta name="description" content="paragonpdx — cause, care, & concern in action. A community home for compassion in Portland.">
<meta name="theme-color" content="#0a0908">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- disclaimer gate: shows FIRST, exact wording, scroll to accept -->
<div id="gate" class="gate" style="display:none">
  <div class="gate-card">
    <img class="gate-logo" src="logo.png" alt="paragonpdx">
    <h1>before you enter</h1>
    <p class="gate-sub">please read this first — it matters.</p>
    <div class="gate-terms" id="gate-terms" tabindex="0"></div>
    <button class="btn" id="gate-accept" disabled>i accept</button>
    <p class="gate-note">scroll all the way down to unlock the button.</p>
  </div>
</div>

<!-- app shell -->
<div id="app" style="display:none">
  <header class="topbar">
    <a class="brand" href="#/" aria-label="paragonpdx hub home">
      <img class="logo" src="logo.png" alt="">
      <span class="brand-text">paragonpdx<small>cause, care, &amp; concern in action...</small></span>
    </a>
    <button class="icon-btn bell" id="bell-btn" style="display:none" aria-label="updates">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
      <span class="dot" id="bell-dot" hidden></span>
    </button>
  </header>

  <!-- news ticker: home only -->
  <div class="ticker" id="ticker" style="display:none" aria-label="news">
    <span class="ticker-label">news</span>
    <div class="ticker-track"><span class="ticker-text" id="ticker-text"></span></div>
  </div>

  <main id="view"></main>

  <nav class="bottomnav" id="bottomnav" style="display:none" aria-label="main">
    <button data-route="#/member"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>home</span></button>
    <button data-route="#/studies"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg><span>studies</span></button>
    <button data-route="#/messages"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span>messages</span><i class="nav-dot" id="nav-msg-dot" hidden></i></button>
    <button data-route="#/notifications"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span>reads</span></button>
    <button data-route="#/menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg><span>menu</span></button>
  </nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
