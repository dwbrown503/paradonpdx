function show(i){cur=i;base.alt='page '+i;
const nextSrc=src(i);if(!base.getAttribute('src').endsWith(nextSrc))base.src=nextSrc;
counter.textContent='Page '+i+' of '+TOTAL;
prevBtn.disabled=i<=1;nextBtn.disabled=i>=TOTAL;
preload(i+1);preload(i+2);preload(i-1);preload(i-2);}
function turn(dir){if(busy)return;const old=cur,t=cur+dir;if(t<1||t>TOTAL)return;busy=true;
const leaf=document.createElement('div');leaf.className='leaf';
leaf.style.transformOrigin=dir>0?'left center':'right center';
const front=document.createElement('div');front.className='face front';
const back=document.createElement('div');back.className='face back';
const fi=document.createElement('img');fi.src=src(old);fi.draggable=false;
const bi=document.createElement('img');bi.src=src(t);bi.draggable=false;
const shade=document.createElement('div');shade.className='shade';
shade.style.transition='opacity .38s ease-in';
front.appendChild(fi);front.appendChild(shade);back.appendChild(bi);
leaf.appendChild(front);leaf.appendChild(back);book.appendChild(leaf);
show(t);
let finished=false;
const finish=()=>{if(finished)return;finished=true;leaf.remove();busy=false;};
leaf.addEventListener('transitionend',e=>{if(e.target===leaf&&e.propertyName==='transform')finish();});
setTimeout(finish,1100);
requestAnimationFrame(()=>requestAnimationFrame(()=>{
leaf.style.transition='transform .8s cubic-bezier(.3,.05,.25,1)';
leaf.style.transform=dir>0?'rotateY(-180deg)':'rotateY(180deg)';
shade.style.opacity='1';
setTimeout(()=>{shade.style.transition='opacity .42s ease-out';shade.style.opacity='0';},380);
}));}
function goTo(i){i=Math.max(1,Math.min(TOTAL,i|0));if(i!==cur&&!busy)show(i);}
prevBtn.onclick=()=>turn(-1);nextBtn.onclick=()=>turn(1);
document.getElementById('zonePrev').onclick=()=>turn(-1);
document.getElementById('zoneNext').onclick=()=>turn(1);
document.addEventListener('keydown',e=>{
if(e.key==='ArrowRight')turn(1);else if(e.key==='ArrowLeft')turn(-1);});
jump.addEventListener('change',()=>{goTo(parseInt(jump.value,10));jump.value='';jump.blur();});
let tx=null;
book.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
book.addEventListener('touchend',e=>{if(tx===null)return;
const dx=e.changedTouches[0].clientX-tx;tx=null;
if(Math.abs(dx)>60)turn(dx<0?1:-1);},{passive:true});
show(1);
</script>
</body>
</html>
